<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cat Solver</title><link rel="icon" href="data:,"><script type="module" src="./solve-page.js?v=full-solver-1"></script></head>
<body>
<h1>Cat Solver</h1>
<p>Nhập JSON level. Solver chạy trong trình duyệt; kết quả là JSON.</p>
<label for="level">Input: level JSON</label><br><textarea id="level" rows="12" cols="80" spellcheck="false"></textarea><br>
<label for="seconds">Thời gian (giây)</label> <input id="seconds" type="number" min="1" max="120" value="60">
<button id="solve">Giải level</button><button id="sample">Level mẫu</button>
<p id="status" role="status">Sẵn sàng.</p>
<label for="output">Output JSON</label><br><textarea id="output" rows="18" cols="80" readonly spellcheck="false"></textarea>
</body></html>
